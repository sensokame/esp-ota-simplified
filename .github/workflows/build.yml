name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install PlatformIO
        run: pip install -r requirements.txt

      - name: Build example
        run: pio ci --lib="." --board=esp32dev examples/basic/basic.ino
